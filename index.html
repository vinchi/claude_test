<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dino Runner</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #535353;
    --muted: #8a8a8a;
  }
  body.night {
    --bg: #202124;
    --text: #bdc1c6;
    --muted: #9aa0a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    transition: background-color .6s ease, color .6s ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  main {
    max-width: 600px;
    margin: 0 auto;
    padding: 12vh 16px 32px;
  }
  #game {
    display: block;
    width: 100%;
    aspect-ratio: 600 / 150;
    image-rendering: pixelated;
    transition: filter .6s ease;
    cursor: pointer;
  }
  body.night #game { filter: invert(1); }
  h1 { font-size: 1.4rem; font-weight: 500; margin: 28px 0 8px; }
  p { margin: 6px 0; line-height: 1.5; }
  .muted { color: var(--muted); font-size: .9rem; }
  kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--muted);
    border-radius: 4px;
    font-size: .8rem;
    font-family: inherit;
  }
  #status::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 6px;
    border-radius: 50%;
    background: #34a853;
    vertical-align: middle;
  }
  #status.offline::before { background: #ea4335; }
</style>
</head>
<body>
<main>
  <canvas id="game" width="600" height="150" aria-label="Dino Runner 게임"></canvas>

  <h1 id="title">인터넷에 연결되어 있지 않음</h1>
  <p id="status" class="muted"></p>
  <p class="muted">
    <kbd>Space</kbd> / <kbd>↑</kbd> 점프 · <kbd>↓</kbd> 숙이기 · <kbd>M</kbd> 소리 끄기/켜기<br>
    모바일: 화면 탭 = 점프 · 아래로 스와이프 = 숙이기
  </p>
</main>

<script>
(() => {
  'use strict';

  // ---------- Constants ----------
  const W = 600, H = 150;
  const GROUND_Y = 127;
  const INK = '#535353';
  const DINO_X = 30;

  const GRAVITY = 0.6;
  const JUMP_VELOCITY = -10;
  const SHORT_JUMP_VELOCITY = -3.5;
  const FAST_DROP = 1.2;

  const START_SPEED = 6;
  const MAX_SPEED = 13;
  const ACCEL = 0.001;

  const NIGHT_EVERY = 700;
  const NIGHT_FRAMES = 60 * 12;

  // ---------- Sprites (# = pixel) ----------
  const DINO_TOP = [
    '          ######## ',
    '         ## #######',
    '         ##########',
    '         ##########',
    '         #####     ',
    '         ########  ',
    '#       #####      ',
    '#      ######      ',
    '##   ##########    ',
    '### ########  #    ',
    '###########        ',
    '###########        ',
    ' #########         ',
    '  ########         ',
    '   ######          ',
  ];
  const DINO_DEAD_TOP = DINO_TOP.map((r, i) =>
    i === 1 ? '         #   ######' :
    i === 2 ? '         # # ######' :
    i === 3 ? '         #   ######' : r);

  const LEGS_STAND = ['    ##  ##', '    #   # ', '    ##  ##'];
  const LEGS_RUN1  = ['    ## ###', '    #     ', '    ##    '];
  const LEGS_RUN2  = ['    ### ##', '        # ', '        ##'];

  const DUCK_TOP = [
    '                  ########  ',
    '#      #######   ## ####### ',
    '##   #######################',
    '############################',
    ' ######################     ',
    '  ################# ####    ',
    '   ##############           ',
  ];
  const DUCK_LEGS1 = ['    ##  ##', '    #    ##', '    ##    '];
  const DUCK_LEGS2 = ['    ### ##', '         #', '         ##'];

  const CACTUS = [
    '   ##   ',
    '  ####  ',
    '  #### #',
    '# #### #',
    '# #### #',
    '# ######',
    '# ####  ',
    '######  ',
    '  ####  ',
    '  ####  ',
    '  ####  ',
    '  ####  ',
  ];

  const PTERO_UP = [
    '      ##           ',
    '      ###          ',
    '      ####         ',
    '   ## #####        ',
    '  ###  #####       ',
    ' ################  ',
    '############### ###',
    '     ##########    ',
    '       #######     ',
    '                   ',
    '                   ',
    '                   ',
  ];
  const PTERO_DOWN = [
    '                   ',
    '                   ',
    '                   ',
    '   ##              ',
    '  ###              ',
    ' ################  ',
    '############### ###',
    '     ##########    ',
    '      ######       ',
    '      ####         ',
    '      ###          ',
    '      ##           ',
  ];

  const CLOUD = [
    '         #####        ',
    '       ##     ##      ',
    '   ####         ##    ',
    '  #               ### ',
    ' #                   #',
    '######################',
  ];

  // Collision boxes are derived from the pixel art: one box per band of rows.
  function hitboxes(rows, s, band = 2) {
    const out = [];
    for (let y0 = 0; y0 < rows.length; y0 += band) {
      let min = Infinity, max = -1;
      const end = Math.min(y0 + band, rows.length);
      for (let y = y0; y < end; y++) {
        const a = rows[y].indexOf('#'), b = rows[y].lastIndexOf('#');
        if (a >= 0) { min = Math.min(min, a); max = Math.max(max, b); }
      }
      if (max >= 0) {
        out.push({ x: min * s + 1, y: y0 * s + 1, w: (max - min + 1) * s - 2, h: (end - y0) * s - 2 });
      }
    }
    return out;
  }

  function sprite(rows, s, color = INK, withBoxes = true) {
    const w = Math.max(...rows.map(r => r.length));
    const c = document.createElement('canvas');
    c.width = w * s;
    c.height = rows.length * s;
    const g = c.getContext('2d');
    g.fillStyle = color;
    rows.forEach((r, y) => {
      for (let x = 0; x < r.length; x++) if (r[x] === '#') g.fillRect(x * s, y * s, s, s);
    });
    return { img: c, w: c.width, h: c.height, boxes: withBoxes ? hitboxes(rows, s) : [] };
  }

  const SPR = {
    stand: sprite([...DINO_TOP, ...LEGS_STAND], 2),
    run1:  sprite([...DINO_TOP, ...LEGS_RUN1], 2),
    run2:  sprite([...DINO_TOP, ...LEGS_RUN2], 2),
    dead:  sprite([...DINO_DEAD_TOP, ...LEGS_STAND], 2),
    duck1: sprite([...DUCK_TOP, ...DUCK_LEGS1], 2),
    duck2: sprite([...DUCK_TOP, ...DUCK_LEGS2], 2),
    cactusS: sprite(CACTUS, 2),
    cactusL: sprite(CACTUS, 3),
    pteroUp: sprite(PTERO_UP, 2),
    pteroDown: sprite(PTERO_DOWN, 2),
    cloud: sprite(CLOUD, 2, '#d4d4d4', false),
  };

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Storage ----------
  function loadHigh() {
    try { return parseInt(localStorage.getItem('dino-high') || '0', 10) || 0; } catch { return 0; }
  }
  function saveHigh(v) {
    try { localStorage.setItem('dino-high', String(v)); } catch { /* ignore */ }
  }

  // ---------- Sound ----------
  let audio = null;
  let muted = false;
  function beep(freq, dur, type = 'square', vol = 0.04, delay = 0) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime + delay;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur);
    } catch { /* audio unavailable */ }
  }
  const sfx = {
    jump: () => beep(720, 0.07),
    score: () => { beep(880, 0.08); beep(1320, 0.12, 'square', 0.04, 0.09); },
    die: () => { beep(180, 0.15, 'sawtooth', 0.06); beep(110, 0.25, 'sawtooth', 0.06, 0.12); },
  };

  // ---------- State ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  let state = 'ready'; // ready | running | over
  let high = loadHigh();
  let score, speed, frame, obstacles, clouds, pebbles, dino, flash, nightLeft, nextNight, overAt;
  const input = { jump: false, duck: false };

  function reset() {
    score = 0;
    speed = START_SPEED;
    frame = 0;
    obstacles = [];
    flash = 0;
    nightLeft = 0;
    nextNight = NIGHT_EVERY;
    document.body.classList.remove('night');
    dino = { y: 0, vy: 0, onGround: true, ducking: false };
    clouds = [{ x: rand(80, 250), y: rand(20, 70) }, { x: rand(330, 560), y: rand(20, 70) }];
    pebbles = Array.from({ length: 24 }, () => newPebble(rand(0, W)));
  }

  function newPebble(x) {
    return { x, dy: Math.floor(rand(2, 9)), w: Math.floor(rand(1, 4)) };
  }

  function start() {
    reset();
    state = 'running';
  }

  // ---------- Obstacles ----------
  function spawnObstacle() {
    const canFly = score > 300;
    const r = Math.random();
    if (canFly && r < 0.22) {
      // Low = must jump, mid = must duck (or jump), high = run underneath.
      const bottom = pick([GROUND_Y + 2, GROUND_Y - 20, GROUND_Y - 48]);
      const h = SPR.pteroUp.h;
      obstacles.push({ kind: 'ptero', x: W, y: bottom - h, w: SPR.pteroUp.w, h, extra: 0.8, anim: 0 });
      return;
    }
    const large = Math.random() < 0.45;
    const spr = large ? SPR.cactusL : SPR.cactusS;
    const maxCount = speed > 8 ? 3 : 2;
    const count = 1 + Math.floor(Math.random() * maxCount);
    const parts = [];
    for (let i = 0; i < count; i++) parts.push({ spr, dx: i * (spr.w - 2) });
    const w = parts[parts.length - 1].dx + spr.w;
    obstacles.push({ kind: 'cactus', x: W, y: GROUND_Y + 3 - spr.h, w, h: spr.h, parts, extra: 0 });
  }

  function obstacleParts(o) {
    if (o.kind === 'ptero') return [{ spr: o.anim < 10 ? SPR.pteroUp : SPR.pteroDown, dx: 0 }];
    return o.parts;
  }

  // ---------- Dino ----------
  function dinoSprite() {
    if (state === 'over') return SPR.dead;
    if (state === 'ready') return SPR.stand;
    if (!dino.onGround) return SPR.stand;
    const alt = Math.floor(frame / 6) % 2 === 0;
    if (dino.ducking) return alt ? SPR.duck1 : SPR.duck2;
    return alt ? SPR.run1 : SPR.run2;
  }

  function dinoPos(spr) {
    return { x: DINO_X, y: GROUND_Y + 2 - spr.h + dino.y };
  }

  function overlaps(ax, ay, aBoxes, bx, by, bBoxes) {
    for (const a of aBoxes) {
      for (const b of bBoxes) {
        if (ax + a.x < bx + b.x + b.w && ax + a.x + a.w > bx + b.x &&
            ay + a.y < by + b.y + b.h && ay + a.y + a.h > by + b.y) return true;
      }
    }
    return false;
  }

  function onJumpPress() {
    if (state === 'ready') { start(); doJump(); return; }
    if (state === 'over') {
      if (performance.now() - overAt > 600) start();
      return;
    }
    if (dino.onGround && !dino.ducking) doJump();
  }

  function doJump() {
    dino.vy = JUMP_VELOCITY;
    dino.onGround = false;
    sfx.jump();
  }

  // ---------- Update ----------
  function update(dt) {
    if (state !== 'running') return;
    frame += dt;

    speed = Math.min(MAX_SPEED, speed + ACCEL * dt);

    // Dino physics
    if (!dino.onGround) {
      if (!input.jump && dino.vy < SHORT_JUMP_VELOCITY) dino.vy = SHORT_JUMP_VELOCITY;
      if (input.duck) dino.vy += FAST_DROP * dt;
      dino.vy += GRAVITY * dt;
      dino.y += dino.vy * dt;
      if (dino.y >= 0) { dino.y = 0; dino.vy = 0; dino.onGround = true; }
    }
    dino.ducking = dino.onGround && input.duck;

    // Obstacles
    for (const o of obstacles) {
      o.x -= (speed + o.extra) * dt;
      if (o.kind === 'ptero') o.anim = (o.anim + dt) % 20;
    }
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    const last = obstacles[obstacles.length - 1];
    if (!last) {
      if (frame > 40) spawnObstacle();
    } else {
      if (last.gap === undefined) last.gap = rand(speed * 34 + 60, speed * 34 + 220);
      if (W - (last.x + last.w) > last.gap) spawnObstacle();
    }

    // Scenery
    for (const c of clouds) c.x -= speed * 0.2 * dt;
    clouds = clouds.filter(c => c.x + SPR.cloud.w > 0);
    if (clouds.length < 4 && (clouds.length === 0 || clouds[clouds.length - 1].x < W - rand(150, 400))) {
      clouds.push({ x: W + rand(0, 60), y: rand(15, 75) });
    }
    for (const p of pebbles) {
      p.x -= speed * dt;
      if (p.x + p.w < 0) Object.assign(p, newPebble(W + rand(0, 40)));
    }

    // Score
    const prev = Math.floor(score);
    score += speed * dt / 36;
    const now = Math.floor(score);
    if (Math.floor(now / 100) > Math.floor(prev / 100)) { sfx.score(); flash = 50; }
    if (flash > 0) flash -= dt;

    // Night cycle
    if (now >= nextNight) {
      nextNight += NIGHT_EVERY;
      nightLeft = NIGHT_FRAMES;
      document.body.classList.add('night');
    }
    if (nightLeft > 0) {
      nightLeft -= dt;
      if (nightLeft <= 0) document.body.classList.remove('night');
    }

    // Collision
    const spr = dinoSprite();
    const dp = dinoPos(spr);
    for (const o of obstacles) {
      if (o.x > DINO_X + spr.w || o.x + o.w < DINO_X) continue;
      for (const part of obstacleParts(o)) {
        if (overlaps(dp.x, dp.y, spr.boxes, o.x + part.dx, o.y, part.spr.boxes)) {
          gameOver();
          return;
        }
      }
    }
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    sfx.die();
    if (Math.floor(score) > high) { high = Math.floor(score); saveHigh(high); }
    if (navigator.vibrate) { try { navigator.vibrate(80); } catch { /* ignore */ } }
  }

  // ---------- Draw ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (const c of clouds) ctx.drawImage(SPR.cloud.img, Math.round(c.x), Math.round(c.y));

    // Ground
    ctx.fillStyle = INK;
    ctx.fillRect(0, GROUND_Y, W, 1);
    for (const p of pebbles) ctx.fillRect(Math.round(p.x), GROUND_Y + p.dy, p.w, 1);

    for (const o of obstacles) {
      for (const part of obstacleParts(o)) {
        ctx.drawImage(part.spr.img, Math.round(o.x + part.dx), Math.round(o.y));
      }
    }

    const spr = dinoSprite();
    const dp = dinoPos(spr);
    ctx.drawImage(spr.img, dp.x, Math.round(dp.y));

    drawScore();

    if (state === 'over') drawGameOver();
  }

  function drawScore() {
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    const cur = String(Math.floor(score)).padStart(5, '0');
    const showCur = !(flash > 0 && Math.floor(flash / 8) % 2 === 0);
    ctx.fillStyle = INK;
    if (showCur) ctx.fillText(cur, W - 10, 8);
    if (high > 0) {
      ctx.fillStyle = '#757575';
      ctx.fillText('HI ' + String(high).padStart(5, '0'), W - 70, 8);
    }
  }

  function drawGameOver() {
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText('G A M E   O V E R', W / 2, 52);

    // Restart icon
    const cx = W / 2, cy = 88;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 11, -Math.PI * 0.35, Math.PI * 1.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 2, cy - 18);
    ctx.lineTo(cx + 9, cy - 11);
    ctx.lineTo(cx + 1, cy - 5);
    ctx.closePath();
    ctx.fill();
  }

  // ---------- Loop ----------
  let lastT = performance.now();
  function loop(t) {
    const dt = Math.min((t - lastT) / (1000 / 60), 3);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  const DUCK_KEYS = ['ArrowDown', 'KeyS'];

  window.addEventListener('keydown', e => {
    if (JUMP_KEYS.includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) { input.jump = true; onJumpPress(); }
    } else if (DUCK_KEYS.includes(e.code)) {
      e.preventDefault();
      input.duck = true;
    } else if (e.code === 'KeyM') {
      muted = !muted;
    } else if (e.code === 'Enter' && state === 'over') {
      onJumpPress();
    }
  });
  window.addEventListener('keyup', e => {
    if (JUMP_KEYS.includes(e.code)) input.jump = false;
    if (DUCK_KEYS.includes(e.code)) input.duck = false;
  });

  let touchY = null;
  document.addEventListener('touchstart', e => {
    if (e.target.closest('a, button')) return;
    e.preventDefault();
    touchY = e.touches[0].clientY;
    input.jump = true;
    onJumpPress();
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (touchY === null) return;
    if (e.touches[0].clientY - touchY > 30) { input.duck = true; input.jump = false; }
  }, { passive: true });
  document.addEventListener('touchend', () => {
    touchY = null;
    input.jump = false;
    input.duck = false;
  });

  canvas.addEventListener('mousedown', () => { input.jump = true; onJumpPress(); });
  window.addEventListener('mouseup', () => { input.jump = false; });

  // ---------- Online / offline status ----------
  const titleEl = document.getElementById('title');
  const statusEl = document.getElementById('status');
  function updateNetwork() {
    const online = navigator.onLine;
    titleEl.textContent = online ? 'Dino Runner' : '인터넷에 연결되어 있지 않음';
    statusEl.textContent = online
      ? '온라인 상태예요. 그래도 공룡은 달릴 수 있어요.'
      : '오프라인 상태예요. 연결을 기다리는 동안 한 판 하세요!';
    statusEl.classList.toggle('offline', !online);
  }
  window.addEventListener('online', updateNetwork);
  window.addEventListener('offline', updateNetwork);
  updateNetwork();

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
